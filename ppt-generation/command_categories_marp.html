<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Command Categories — Marp</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@marp-team/marp-core@4/themes/default.css">
  <style>
    section { font-family: sans-serif; }
    section h2 { margin-bottom: 0.5rem; }
    section code { background: rgba(128,128,128,0.2); padding: 0.2rem 0.4rem; border-radius: 4px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="marp-slides"></div>

  <script type="module">
    import { Marp } from 'https://esm.sh/@marp-team/marp-core@4/browser';

    const markdown = `---
marp: true
theme: default
---

# Command Categories
## Quick Reference
Browser automation & testing commands

---

## Navigation (6)
\`open\` \`back\` \`forward\` \`reload\` \`close\` \`connect\`

---

## Interaction (17)
\`click\` \`dblclick\` \`focus\` \`fill\` \`type\` \`press\` \`select\` \`check\` \`uncheck\` \`hover\` \`drag\` \`scroll\`

---

## Inspection (8)
\`get text\` \`get html\` \`get value\` \`get attr\` \`get title\` \`get url\` \`get count\` \`get box\` \`get styles\`

---

## State Checks (3)
\`is visible\` \`is enabled\` \`is checked\`

---

## Screenshots & PDF (4)
\`screenshot\` \`screenshot --full\` \`screenshot --element\` \`pdf\`

---

## Video Recording (3)
\`record start\` \`record stop\` \`record restart\`

---

## Wait / Timing (5)
\`wait for\` \`wait milliseconds\` \`wait for text\` \`wait for url\` \`wait for load\`

---

## Mouse Control (4)
\`mouse move\` \`mouse down\` \`mouse up\` \`mouse wheel\`

---

## Semantic Locators (11)
\`find by role\` \`find by text\` \`find by label\` \`find by placeholder\` \`find by alt\` \`find by title\` \`find by testid\` \`first\` \`last\` \`nth\`

---

## Browser Settings (8)
\`set viewport\` \`set device\` \`set geo\` \`set offline\` \`set headers\` \`set credentials\` \`set media\`

---

## Cookies & Storage (7)
\`get cookies\` \`set cookies\` \`delete cookies\` \`get storage\` \`set storage\` \`clear storage\`

---

## Network (6)
\`route\` \`unroute\` \`network requests\` \`network --filter\` \`abort\` \`fulfill\`

---

## Tabs & Windows (6)
\`new tab\` \`switch tab\` \`close tab\` \`new window\` \`switch window\` \`close window\`

---

## Frames (2)
\`frame switch\` \`frame main\`

---

## Dialogs & JS (3)
\`dialog accept\` \`dialog dismiss\` \`eval\`

---

# Thank you
`;

    const marp = new Marp();
    const { html, css } = marp.render(markdown);
    document.getElementById('marp-slides').innerHTML = `<style>${css}</style>${html}`;
  </script>
</body>
</html>
